[package]
name = "bxdl"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.86"
publish = false

[dependencies]
base64 = "=0.22.1"
cap-std = "=3.4.6"
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "pem"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
hex = "=0.4.3"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
time = { version = "=0.3.45", features = ["formatting"] }
unicode-normalization = "=0.1.24"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
strip = true
lto = "thin"
