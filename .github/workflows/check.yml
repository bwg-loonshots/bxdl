name: BXDL Rust foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Mac installation fixtures repeatedly package the test executable.
    # Allow slower hosted runners to finish the same complete test suite.
    timeout-minutes: ${{ matrix.os == 'macos-15' && 25 || 15 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal --component rustfmt --component clippy
      - name: Format, Clippy, and tests
        # Archive fixtures copy the current test executable. Drop only test
        # debuginfo; keep debug assertions, overflow checks and release settings.
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: make check
      - name: Build host CLI
        env:
          BXDL_REVISION: ${{ github.sha }}
        run: make build
      - name: Exercise signed Linux download installation with fixture payloads
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # Use the same protected path layout as the release builder.
          umask 022
          work=$(mktemp -d /tmp/bxdl-release-test.XXXXXXXX)
          git archive HEAD | tar -x -C "$work"
          install -m 0755 bin/bxdl "$work/bxdl"
          cd "$work"
          BXDL_TEST_RELEASE_CLI="$work/bxdl" python3 -B -m unittest discover -s tests/acceptance -p test_linux_release_smoke.py
          BXDL_TEST_LINUX_RELEASE_HELPER=1 python3 -B -m unittest discover -s tests/acceptance -p test_release_helper.py
      - name: Exercise CLI only (not engine or service acceptance)
        run: ./bin/bxdl version --json
